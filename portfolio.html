<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Gemray Studio Portfolio - Timeless Wedding Photography, Pre-Wedding, and Cinematography by Bhushan Lawane.">
    <meta name="theme-color" content="#062a23">
    <title>Portfolio | Gemray Studio</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="photos/logo.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400;1,9..144,500&family=Montserrat:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css?v=2.2">
    
    <style>
        /* =====================================================
           PORTFOLIO PAGE DEDICATED STYLES
           ===================================================== */
        
        /* 1. TOP NAVIGATION BAR (EMERALD & GOLD) */
        .portfolio-nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 84px;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 clamp(16px, 3.5vw, 50px);
            background: rgba(6, 42, 35, 0.94);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(212, 175, 90, 0.25);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
            transition: background 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease;
        }

        .portfolio-nav-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            z-index: 1002;
            flex-shrink: 0;
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.3s ease;
        }

        .portfolio-nav-logo:hover {
            transform: scale(1.05);
        }

        .portfolio-nav-logo img {
            height: clamp(44px, 5vw, 60px);
            width: auto;
            max-height: 60px;
            object-fit: contain;
            filter: drop-shadow(0 0 12px rgba(212, 175, 90, 0.45));
            transition: filter 0.3s ease, transform 0.3s ease;
        }

        .portfolio-nav-logo:hover img {
            filter: drop-shadow(0 0 18px rgba(212, 175, 90, 0.75));
        }

        /* Nav Links */
        .portfolio-nav-links {
            display: flex;
            align-items: center;
            gap: clamp(8px, 1.6vw, 18px);
        }

        .portfolio-nav-links a {
            position: relative;
            color: rgba(255, 255, 255, 0.85);
            font-family: "Montserrat", sans-serif;
            font-size: 0.78rem;
            font-weight: 500;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            text-decoration: none;
            padding: 8px 18px;
            border-radius: 999px;
            border: 1px solid transparent;
            white-space: nowrap;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .portfolio-nav-links a:hover {
            color: var(--gold-light);
            background: rgba(212, 175, 90, 0.1);
            border-color: rgba(212, 175, 90, 0.3);
            transform: translateY(-1px);
        }

        .portfolio-nav-links a.active {
            color: var(--gold-light);
            background: rgba(212, 175, 90, 0.15);
            border-color: var(--gold);
            box-shadow: 0 0 16px rgba(212, 175, 90, 0.25);
        }

        .portfolio-nav-links a.portfolio-nav-wa-pill {
            background: linear-gradient(135deg, rgba(212, 175, 90, 0.22) 0%, rgba(6, 42, 35, 0.85) 100%);
            border: 1px solid rgba(212, 175, 90, 0.45);
            color: var(--gold-light);
            font-weight: 600;
        }

        .portfolio-nav-links a.portfolio-nav-wa-pill:hover {
            background: linear-gradient(135deg, rgba(212, 175, 90, 0.35) 0%, rgba(6, 42, 35, 0.95) 100%);
            border-color: var(--gold);
            color: #ffffff;
        }


        /* 2. HERO / FILTER SECTION */
        .portfolio-hero {
            padding: 125px 20px 30px;
            text-align: center;
            background: linear-gradient(180deg, var(--green-dark) 0%, var(--green) 100%);
            position: relative;
            overflow: hidden;
        }

        .portfolio-hero::before {
            content: "";
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: min(800px, 100%);
            height: 200px;
            background: radial-gradient(ellipse at top, rgba(212, 175, 90, 0.12) 0%, transparent 70%);
            pointer-events: none;
        }

        /* 3. FILTER TABS */
        .gallery-tabs {
            width: min(100%, 750px);
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .tab {
            padding: 10px 24px;
            color: rgba(255, 255, 255, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.22);
            background: rgba(6, 42, 35, 0.55);
            backdrop-filter: blur(20px) saturate(190%);
            -webkit-backdrop-filter: blur(20px) saturate(190%);
            border-radius: 999px;
            font-family: "Montserrat", sans-serif;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25), inset 0 1px 1px rgba(255, 255, 255, 0.25);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .tab:hover {
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.45);
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35), inset 0 1px 1.5px rgba(255, 255, 255, 0.45);
            transform: translateY(-2px);
        }

        .tab.active {
            color: var(--gold-light);
            border-color: rgba(212, 175, 90, 0.6);
            background: linear-gradient(135deg, rgba(212, 175, 90, 0.32) 0%, rgba(6, 42, 35, 0.75) 100%);
            box-shadow: 0 0 20px rgba(212, 175, 90, 0.3), inset 0 1px 1.5px rgba(255, 255, 255, 0.6);
            transform: translateY(-2px);
        }

        /* 4. GALLERY GRID */
        .portfolio-full-grid {
            width: min(calc(100% - 32px), 1400px);
            margin: 0 auto clamp(60px, 10vw, 100px);
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }

        .portfolio-item {
            position: relative;
            aspect-ratio: 4 / 5;
            overflow: hidden;
            border-radius: 6px;
            background: var(--green-dark);
            border: 1px solid rgba(212, 175, 90, 0.22);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.4s ease, box-shadow 0.4s ease, opacity 0.35s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .portfolio-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
        }

        .portfolio-item video,
        .portfolio-grid-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
        }

        /* Luxury View Overlay Hint on Hover */
        .portfolio-item::after {
            content: "VIEW";
            position: absolute;
            inset: 0;
            background: rgba(6, 42, 35, 0.55);
            color: var(--gold-light);
            font-family: "Cinzel Decorative", serif;
            font-size: 0.85rem;
            letter-spacing: 0.25em;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
        }

        .portfolio-item:hover {
            transform: translateY(-4px);
            border-color: var(--gold);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 15px rgba(212, 175, 90, 0.2);
        }

        .portfolio-item:hover video {
            transform: scale(1.06);
        }

        .portfolio-item:hover img {
            transform: scale(1.06);
        }

        .portfolio-item:hover::after {
            opacity: 1;
        }

        .portfolio-item.hidden {
            display: none !important;
        }

        .portfolio-item.g-item-hidden-limit {
            display: none !important;
        }

        @keyframes galleryFadeIn {
            0% {
                opacity: 0;
                transform: translateY(20px) scale(0.97);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .portfolio-item.g-item-reveal {
            animation: galleryFadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* 5. EXPLORE MORE GALLERY BUTTON */
        .gallery-explore-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: -30px auto clamp(60px, 8vw, 90px);
            width: 100%;
            position: relative;
            z-index: 10;
        }

        .gallery-explore-container.hidden {
            display: none !important;
        }

        .gallery-explore-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 14px 34px;
            background: rgba(6, 42, 35, 0.88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(212, 175, 90, 0.45);
            border-radius: 40px;
            color: var(--gold-light);
            font-family: "Cinzel Decorative", serif;
            font-size: 0.88rem;
            font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45), 0 0 20px rgba(212, 175, 90, 0.18);
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .gallery-explore-btn:hover {
            background: linear-gradient(135deg, rgba(212, 175, 90, 0.22) 0%, rgba(184, 134, 11, 0.38) 100%);
            border-color: var(--gold);
            color: #ffffff;
            box-shadow: 0 14px 36px rgba(0, 0, 0, 0.6), 0 0 28px rgba(212, 175, 90, 0.4);
            transform: translateY(-3px) scale(1.02);
        }

        .gallery-explore-btn:active {
            transform: translateY(0) scale(0.98);
        }

        .explore-btn-sparkle {
            color: var(--gold);
            font-size: 1.05rem;
            line-height: 1;
            display: inline-block;
            transition: transform 0.3s ease;
        }

        .gallery-explore-btn:hover .explore-btn-sparkle {
            transform: rotate(45deg) scale(1.15);
            color: var(--gold-light);
        }

        .explore-btn-count {
            background: rgba(212, 175, 90, 0.18);
            border: 1px solid rgba(212, 175, 90, 0.4);
            border-radius: 12px;
            padding: 2px 9px;
            font-family: "Montserrat", sans-serif;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            color: var(--gold-light);
        }

        .explore-btn-arrow {
            display: inline-block;
            font-size: 0.95rem;
            transition: transform 0.3s ease;
            animation: exploreArrowFloat 2s ease-in-out infinite;
        }

        @keyframes exploreArrowFloat {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(3px);
            }
        }

        /* 6. LIGHTBOX POSITION COUNTER */
        .lightbox-counter {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 6;
            color: var(--gold-light);
            font-family: "Cinzel Decorative", serif;
            font-size: 0.88rem;
            letter-spacing: 0.16em;
            background: rgba(6, 42, 35, 0.85);
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid rgba(212, 175, 90, 0.3);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            pointer-events: none;
        }

        .lightbox-video {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 4px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
        }

        /* =========================================================
           7. FULLSCREEN MOBILE REELS VIEWER (MOBILE ONLY)
           ========================================================= */
        .mobile-reels-modal {
            position: fixed;
            inset: 0;
            z-index: 3000;
            background: #020b08;
            display: flex;
            flex-direction: column;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.35s ease, visibility 0.35s ease;
        }

        .mobile-reels-modal.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        /* Top Header Bar */
        .mobile-reels-top-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 65px;
            padding: max(12px, env(safe-area-inset-top, 12px)) 16px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.75) 0%, rgba(0, 0, 0, 0.25) 70%, transparent 100%);
            pointer-events: none;
        }

        .reels-brand-tag {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(6, 42, 35, 0.75);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(212, 175, 90, 0.4);
            border-radius: 999px;
            padding: 6px 14px;
            color: var(--gold-light);
            font-family: 'Cinzel Decorative', serif;
            font-size: 0.78rem;
            letter-spacing: 0.12em;
            pointer-events: auto;
        }

        .reels-glow-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--gold);
            box-shadow: 0 0 8px var(--gold);
            animation: reelsDotPulse 1.8s ease-in-out infinite;
        }

        @keyframes reelsDotPulse {
            0%, 100% { opacity: 0.6; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .reels-counter-badge {
            color: rgba(255, 255, 255, 0.9);
            font-family: 'Montserrat', sans-serif;
            font-size: 0.76rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px 12px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            pointer-events: auto;
        }

        .reels-close-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(6, 42, 35, 0.85);
            border: 1px solid rgba(212, 175, 90, 0.45);
            color: var(--gold-light);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            pointer-events: auto;
            transition: transform 0.2s ease, background 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .reels-close-btn:active {
            transform: scale(0.92);
            background: rgba(212, 175, 90, 0.3);
        }

        /* Vertical Reel Container with Snapping */
        .mobile-reels-container {
            width: 100vw;
            height: 100svh;
            overflow-y: scroll;
            overflow-x: hidden;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .mobile-reels-container::-webkit-scrollbar {
            display: none;
        }

        /* Individual Reel Slide */
        .mobile-reel-slide {
            width: 100vw;
            height: 100svh;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #020b08;
        }

        /* Ambient Glass/Glow Background Blur */
        .reel-ambient-bg-wrap {
            position: absolute;
            inset: -20px;
            z-index: 1;
            overflow: hidden;
            filter: blur(45px) brightness(0.35) saturate(150%);
            -webkit-filter: blur(45px) brightness(0.35) saturate(150%);
            pointer-events: none;
            transform: scale(1.15);
        }

        .reel-ambient-photo,
        .reel-ambient-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Media Container */
        .reel-media-wrapper {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .reel-main-photo {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: 4px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
        }

        .reel-main-video {
            max-width: 100%;
            max-height: 100%;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Sound Button in Reel */
        .reel-sound-toggle-btn {
            position: absolute;
            bottom: max(30px, env(safe-area-inset-bottom, 30px));
            right: 18px;
            z-index: 8;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(6, 42, 35, 0.85);
            border: 1px solid rgba(212, 175, 90, 0.6);
            color: var(--gold-light);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .reel-sound-toggle-btn:active {
            transform: scale(0.9);
        }

        /* Center Play/Pause Pop Indicator */
        .reel-video-play-indicator {
            position: absolute;
            inset: 0;
            margin: auto;
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1.5px solid rgba(212, 175, 90, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gold-light);
            opacity: 0;
            pointer-events: none;
            transform: scale(0.7);
            transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 5;
        }

        .reel-video-play-indicator.visible {
            opacity: 1;
            transform: scale(1);
        }

        /* Bottom Swipe Guide */
        .reels-bottom-info {
            position: absolute;
            bottom: max(14px, env(safe-area-inset-bottom, 14px));
            left: 50%;
            transform: translateX(-50%);
            z-index: 7;
            pointer-events: none;
        }

        .reels-swipe-guide {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.72rem;
            font-weight: 500;
            letter-spacing: 0.08em;
            color: rgba(255, 255, 255, 0.6);
            background: rgba(0, 0, 0, 0.35);
            padding: 4px 12px;
            border-radius: 999px;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            animation: reelsSwipeBounce 2.4s ease-in-out infinite;
        }

        @keyframes reelsSwipeBounce {
            0%, 100% { transform: translateY(0); opacity: 0.6; }
            50% { transform: translateY(-4px); opacity: 0.95; color: var(--gold-light); }
        }

        /* =====================================================
           RESPONSIVE BREAKPOINTS (TABLET & MOBILE)
           ===================================================== */
        
        /* TABLET (< 1024px) */
        @media (max-width: 1024px) {
            .portfolio-full-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 14px;
            }
        }

        /* MOBILE (< 768px): HORIZONTAL SWIPEABLE NAVBAR */
        @media (max-width: 768px) {
            .portfolio-nav {
                height: 66px;
                padding: 0 10px 0 14px;
                display: flex;
                align-items: center;
                justify-content: flex-start;
                gap: 10px;
            }

            .portfolio-nav-logo {
                flex-shrink: 0;
                margin-right: 2px;
            }

            .portfolio-nav-logo img {
                height: 40px;
                width: auto;
                max-height: 40px;
            }

            .portfolio-nav-links {
                flex: 1 1 auto;
                min-width: 0;
                display: flex;
                flex-direction: row;
                align-items: center;
                justify-content: flex-start;
                gap: 6px;
                overflow-x: auto;
                overflow-y: hidden;
                white-space: nowrap;
                padding: 4px 6px 4px 2px;
                scrollbar-width: none;
                -webkit-overflow-scrolling: touch;
                scroll-snap-type: x proximity;
            }

            .portfolio-nav-links::-webkit-scrollbar {
                display: none;
            }

            .portfolio-nav-links a {
                flex: 0 0 auto;
                padding: 6px 13px;
                font-size: 0.72rem;
                letter-spacing: 0.08em;
                border-radius: 999px;
                background: rgba(255, 255, 255, 0.04);
                border: 1px solid rgba(212, 175, 90, 0.22);
                color: rgba(255, 255, 255, 0.88);
                scroll-snap-align: start;
                transition: all 0.2s ease;
            }

            .portfolio-nav-links a:hover,
            .portfolio-nav-links a:active {
                color: var(--gold-light);
                border-color: rgba(212, 175, 90, 0.5);
            }

            .portfolio-nav-links a.active {
                background: rgba(212, 175, 90, 0.2);
                border-color: var(--gold);
                color: var(--gold-light);
                box-shadow: 0 0 12px rgba(212, 175, 90, 0.25);
            }

            .portfolio-nav-links a.portfolio-nav-wa-pill {
                padding: 6px 13px;
